<!DOCTYPE html>
<html>
<head>
  <!-- voir https://gsap.com/docs/v3/Installation/ -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <!-- mixin SVGelement -->
  <script src="http://pierre.nerzic.free.fr/Multimedia/fichiers/svgelement.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 16 9" id="dessin"></svg>

  <script>
    class Voilier {
      constructor(parent) {
        // groupe pour englober le voilier
        this.g = parent.appendElement("g");
        
        // Voile
        this.g.appendElement("path", {
          d: "M 9 5 L 6 0.5 L 4 5 Z",
          fill: "white",
          stroke: "black",
          "stroke-width": "0.03"
        })

        // Mât
        this.g.appendElement("rect", {
          x: "6",
          y: "0.5",
          width: "0.10",
          height: "5",
          fill: "#DDD"
        })

        // Coque
        this.g.appendElement("path", {
          d: "M 9 5 L 3.5 5.3 L 3 6.5 L 8.5 6.5 Z",
          fill: "red"
        })
      }
    }

    class Paysage {
      constructor(parent) {
        // groupe pour le paysage
        const g = parent.appendElement("g");

        // Ciel
        g.appendElement("rect", {
          x: "0",
          y: "0",
          width: "16",
          height: "9",
          fill: "#CFF"
        })

        // Mer
        g.appendElement("rect", {
          x: "0",
          y: "6",
          width: "16",
          height: "3",
          fill: "#88F"
        })

        // Soleil
        this.soleil = g.appendElement("circle", {
          cx: "12",
          cy: "1.5",
          r: "1",
          fill: "yellow"
        })

        // Voilier
        this.voilier = new Voilier(g);
      }
    }

    const svg = SVGelement.fromSelector("#dessin")
    const paysage = new Paysage(svg)


    gsap.to(paysage.soleil, { x: -12, y: 2, duration: 5, ease: 'none', fill: 'yellow', repeat: -1, yoyo: true })
    gsap.to(paysage.soleil, { x: 0, y: 0, delay: 5, duration: 5, ease: 'none', fill: 'orange', repeat: -1, yoyo: true })

    gsap.to(paysage.voilier.g , { x: 6, duration: 5, ease: 'none',repeat: -1, yoyo: true })
    gsap.to(paysage.voilier.g , { x: 0, delay:5, duration: 5, ease: 'none',repeat: -1, yoyo: true })
    

  </script>
</body>
</html>
